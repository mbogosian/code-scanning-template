name: pre-commit

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: pre-commit run --all-files
        env:
          # The gitleaks, osv-scanner, semgrep, trivyfs-docker, and trivyconfig-docker hooks have their own workflows.
          # SKIP stops this workflow from running those hooks again.
          SKIP: gitleaks,osv-scanner,semgrep,trivyfs-docker,trivyconfig-docker
      - run: git diff --exit-code --
